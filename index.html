    <script>
      // Suppress Vite HMR WebSocket errors in AI Studio iframe preview
      window.addEventListener('unhandledrejection', function (event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.stack || '')) || '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || '')) || '';
        var src = (event && (event.filename || '')) || '';
        if (msg.includes('WebSocket') || src.includes('@vite/client')) {
          event.preventDefault();
        }
      });
    </script>
